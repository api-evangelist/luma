                          - label
                          - required
                          - question_type
                        - type: object
                          properties:
                            id:
                              type: string
                            label:
                              type: string
                            required:
                              type: boolean
                            question_type:
                              type: string
                              const: twitter
                          required:
                          - id
                          - label
                          - required
                          - question_type
                        - type: object
                          properties:
                            id:
                              type: string
                            label:
                              type: string
                            required:
                              type: boolean
                            question_type:
