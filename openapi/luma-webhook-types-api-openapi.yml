                              type: string
                            label:
                              type: string
                            required:
                              type: boolean
                            question_type:
                              type: string
                              const: terms
                            terms:
                              oneOf:
                              - type: object
                                properties:
                                  content_type:
                                    type: string
                                    const: text
                                  content_md:
                                    type: string
                                    description: Markdown content for the terms. Luma converts this to rich text internally.
                                  collect_signature:
                                    type: boolean
                                  require_review:
                                    description: When true, guests must open the hosted terms before accepting.
                                    type: boolean
                                required:
                                - content_type
                                - content_md
                                - collect_signature
                              - type: object
                                properties:
                                  content_type:
                                    type: string
                                    const: link
                                  url:
                                    type: string
                                    format: uri
                                  collect_signature:
                                    type: boolean
                                required:
