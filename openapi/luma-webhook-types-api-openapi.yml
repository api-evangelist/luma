                      type: string
                      description: IANA Timezone, e.g. America/New_York. https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
                    name:
                      type: string
                    description:
                      type: string
                    description_md:
                      type: string
                    geo_address_json:
                      anyOf:
                      - type: object
                        properties:
                          address:
                            type: string
                          city:
                            anyOf:
                            - type: string
                            - type: 'null'
                          region:
                            anyOf:
                            - type: string
                            - type: 'null'
                          country:
                            anyOf:
                            - type: string
                            - type: 'null'
                          city_state:
                            anyOf:
                            - type: string
                            - type: 'null'
                          full_address:
                            anyOf:
                            - type: string
                            - type: 'null'
                          google_maps_place_id:
                            anyOf:
