                        - address
                        - city
                        - region
                        - country
                        - city_state
                        - full_address
                        - google_maps_place_id
                        - apple_maps_place_id
                        - description
                      - type: 'null'
                    coordinate:
                      anyOf:
                      - type: object
                        properties:
                          longitude:
                            type: number
                          latitude:
                            type: number
                        required:
                        - longitude
                        - latitude
                      - type: 'null'
                      description: Latitude and longitude of the event location. Null for online events or when the address can't be geocoded.
                    meeting_url:
                      anyOf:
                      - type: string
                      - type: 'null'
                    location_type:
                      type: string
                      enum:
                      - discord
                      - meet
                      - twitch
                      - twitter
                      - youtube
                      - zoom
                      - offline
                      - missing
                      - unknown
