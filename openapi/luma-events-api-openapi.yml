        description: Guest identifier — the guest ID (gst-), a ticket key, a guest key (g-), or the user's email.
      description: 'Get detailed information for an event guest by looking them up by their ID. This supports looking them up by different parameters.


        This response includes `event_ticket_orders`, which includes `coupon_info` when a coupon was applied.'
